<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 비서 cal-bee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 헤더 -->
    <header>
        <h1>나만의 비서 cal-bee !</h1>
        <div class="nav-menu">
            <a href="#">Sign up</a>
            <a href="#">Sign in</a>
        </div>
    </header>

    <!-- 메인 -->
    <main>
        <!-- 로고와 대화 로그 영역 -->
        <div class="content-wrapper clearfix">
            <div class="logo-section">
                <img src="/src/calbee-logo2.png">
            </div>
            <div class="chat-log-section">
                <div class="chat-box">
                    <p><strong>[시스템]:</strong> cal-bee와 연결되었습니다.</p>
                    <p><strong>cal-bee:</strong> 안녕하세요! 오늘 어떤 도움이 필요하신가요?</p>
                    <!-- 추후 사용자와의 대화 내용이 스크립트를 통해 이곳에 추가됩니다 -->
                </div>
            </div>
        </div>

        <!-- 하단 채팅/검색 입력 영역 -->
        <div class="search-input-section">
            <input type="text" placeholder="cal-bee에게 무엇이든 물어보세요..." autocomplete="off">
            <button type="button">전송</button>
        </div>
    </main>

    <!-- 푸터 -->
    <footer>
        <p>company hyangchoon</p>
    </footer>

</body>
</html>
